<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>By Sara Online — Fashion Store</title>
  <meta name="description" content="By Sara Online — Fashion Store. New dresses, abayas, sets and more, updated live.">
  <meta name="theme-color" content="#f4e3e4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="By Sara">
  <meta property="og:title" content="By Sara Online — Fashion Store">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Great+Vibes&family=Jost:wght@400;500;600&family=Playfair+Display:wght@500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="marble"></div>
  <div class="bg-logo" id="bgLogo"></div>

  <div class="announce" id="announce"></div>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="badge" id="badgeLogo"></span>
      <span class="word">By Sara Online</span>
    </a>
    <span class="spacer"></span>
    <span class="live-dot" id="liveDot" title=""></span>
    <button class="pill-btn" id="langBtn"></button>
    <button class="pill-btn bag-btn" id="bagBtn" aria-label="bag">👜 <span class="bag-count" id="bagCount"></span></button>
  </header>

  <section class="hero">
    <div class="hero-logo" id="heroLogo"></div>
    <p class="tagline" id="tagline"></p>
    <div class="socials" id="socials"></div>
  </section>

  <div class="closed-banner" id="closed" hidden><div></div></div>

  <section class="controls">
    <input class="search" id="search" type="search" autocomplete="off">
    <div class="chips" id="chips"></div>
  </section>

  <main class="grid" id="grid"></main>

  <footer class="foot" id="foot"></footer>

  <div class="overlay" id="pdOverlay"><div class="sheet" id="pdSheet"></div></div>
  <div class="overlay" id="bagOverlay"><div class="sheet" id="bagSheet"></div></div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/db.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
